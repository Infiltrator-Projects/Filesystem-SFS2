# SPDX-License-Identifier: GPL-3.0-or-later
# Qualify actual packaged hosted and embedded Common V2 file namespaces.
# BOOT-ready release remains blocked until its unmodified production validator
# and genuine OVMF kernel/initramfs handoff can be exercised.
name: Qualify SFS2 hosted V2 DEB and native RUN without kernel substitute
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install native toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential binutils cmake git pkg-config libssl-dev libsqlite3-dev dpkg-dev
      - name: Qualify portable source-owned V2 ELF
        run: |
          set -euo pipefail
          python3 standalone/release.py release
          python3 standalone/check-package.py dist/*.deb --profile portable
          test "$(find dist -maxdepth 1 -name '*.deb' | wc -l)" = 1
          test "$(find dist -maxdepth 1 -name '*.run' | wc -l)" = 1
          test "$(find dist -maxdepth 1 -name '*.ko' | wc -l)" = 0
          mkdir -p "$RUNNER_TEMP/portable"
          dpkg-deb -x dist/*.deb "$RUNNER_TEMP/portable"
          test "$(find "$RUNNER_TEMP/portable" -type f | wc -l)" = 2
          bash tests/check_v2_exports.sh "$RUNNER_TEMP/portable/System/Filesystems/SFS2.so"
      - name: Qualify native source-embedded RUN and installed V2 export
        run: |
          set -euo pipefail
          installer="$(find dist -maxdepth 1 -name '*.run' -print -quit)"
          bash "$installer" --profile aggressive --build-only --output "$RUNNER_TEMP/native"
          deb="$(find "$RUNNER_TEMP/native" -maxdepth 1 -name '*.deb' -print -quit)"
          test -s "$deb"
          python3 standalone/check-package.py "$deb" --profile aggressive
          mkdir -p "$RUNNER_TEMP/root"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/root"
          test "$(find "$RUNNER_TEMP/root" -type f | wc -l)" = 2
          bash tests/check_v2_exports.sh "$RUNNER_TEMP/root/System/Filesystems/SFS2.so"
          test "$(find "$RUNNER_TEMP/root" -name '*.ko' | wc -l)" = 0
      - name: Exercise actual packaged hosted and embedded firmware V2 readers
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/qualification -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build/qualification --parallel 2
          ctest --test-dir build/qualification --output-on-failure
          for module in \
            "$RUNNER_TEMP/portable/System/Filesystems/SFS2.so" \
            "$RUNNER_TEMP/root/System/Filesystems/SFS2.so"; do
            test -s "$module"
            build/qualification/sfs2-module-test "$module" hosted
            sh tests/format_media.sh build/qualification/sfs2-native-format-test "$module"
            readelf -SW "$module" | grep -F .infiltrator_boot
            objcopy --dump-section \
              ".infiltrator_boot=$RUNNER_TEMP/packaged-sfs2-firmware.so" "$module"
            build/qualification/sfs2-module-test \
              "$RUNNER_TEMP/packaged-sfs2-firmware.so"
          done
          echo SFS2_BOTH_PACKAGED_V2_NAMESPACE_AND_FIRMWARE_PAYLOAD_PASS
      - uses: actions/upload-artifact@v4
        with:
          name: SFS2-hosted-only-V2-qualification
          path: dist/*
          if-no-files-found: error
  publish:
    needs: qualify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SFS2-hosted-only-V2-qualification
          path: dist
      - name: Publish immutable Common V2 packages without kernel substitutes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          tag="v$version"
          test "$(find dist -maxdepth 1 -type f -name '*.deb' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.run' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.ko' | wc -l)" -eq 0
          if gh release view "$tag" --json tagName >/dev/null 2>&1; then
            echo "Existing immutable release $tag preserved"
            exit 0
          fi
          gh release create "$tag" dist/*.deb dist/*.run --target "$GITHUB_SHA" \
            --title "SFS2 Common V2 filesystem release $version" \
            --notes "SFS2 Common V2 hosted and embedded freestanding filesystem reader, packaged as one .so and one manual. Tested with namespace and corrupted disposable images. Not yet qualified by a V2-capable BOOT consumer."
