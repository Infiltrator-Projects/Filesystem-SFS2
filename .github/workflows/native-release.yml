# Metadata-only Common V2. Firmware release blocked until genuine native
# SFS2 file traversal/reads, production BOOT validator and OVMF boot pass.
name: Qualify SFS2 hosted V2 DEB and native RUN without kernel substitute
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install native toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential binutils cmake git pkg-config libssl-dev libsqlite3-dev dpkg-dev
      - name: Qualify portable source-owned V2 ELF
        run: |
          set -euo pipefail
          python3 standalone/release.py release
          python3 standalone/check-package.py dist/*.deb --profile portable
          test "$(find dist -maxdepth 1 -name '*.deb' | wc -l)" = 1
          test "$(find dist -maxdepth 1 -name '*.run' | wc -l)" = 1
          test "$(find dist -maxdepth 1 -name '*.ko' | wc -l)" = 0
          mkdir -p "$RUNNER_TEMP/portable"
          dpkg-deb -x dist/*.deb "$RUNNER_TEMP/portable"
          test "$(find "$RUNNER_TEMP/portable" -type f | wc -l)" = 2
          bash tests/check_v2_exports.sh "$RUNNER_TEMP/portable/System/Filesystems/SFS2.so"
      - name: Qualify native source-embedded RUN and installed V2 export
        run: |
          set -euo pipefail
          installer="$(find dist -maxdepth 1 -name '*.run' -print -quit)"
          bash "$installer" --profile aggressive --system-package-mode --build-only --output "$RUNNER_TEMP/native"
          deb="$(find "$RUNNER_TEMP/native" -maxdepth 1 -name '*.deb' -print -quit)"
          test -s "$deb"
          python3 standalone/check-package.py "$deb" --profile aggressive
          mkdir -p "$RUNNER_TEMP/root"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/root"
          test "$(find "$RUNNER_TEMP/root" -type f | wc -l)" = 2
          bash tests/check_v2_exports.sh "$RUNNER_TEMP/root/System/Filesystems/SFS2.so"
          test "$(find "$RUNNER_TEMP/root" -name '*.ko' | wc -l)" = 0
      - uses: actions/upload-artifact@v4
        with:
          name: SFS2-hosted-only-V2-qualification
          path: dist/*
          if-no-files-found: error
