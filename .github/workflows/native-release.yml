name: Qualify and publish SFS2 standalone two-file native installers
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: filesystem-sfs2-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install standalone build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential binutils cmake git pkg-config libssl-dev libsqlite3-dev dpkg-dev python3
      - name: Package portable module and source-embedded CPU-native RUN
        run: |
          set -euo pipefail
          python3 -m py_compile standalone/build.py standalone/release.py
          python3 standalone/release.py release
          python3 standalone/check-package.py dist/*.deb --profile portable
          sudo python3 standalone/check-documentation-upgrade.py dist/*.deb
          test "$(find dist -maxdepth 1 -type f -name '*.deb' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.run' | wc -l)" -eq 1
      - name: Qualify RUN independently and enforce two-file payload
        run: |
          set -euo pipefail
          bash dist/*.run --profile aggressive --system-package-mode --build-only --output "$RUNNER_TEMP/native"
          package="$(find "$RUNNER_TEMP/native" -type f -name '*.deb' -print -quit)"
          test -s "$package"
          test "$(dpkg-deb -f "$package" X-Infiltrator-Native-Profile)" = aggressive
          test "$(dpkg-deb -f "$package" X-Infiltrator-PGO)" = trained-two-pass
          test "$(dpkg-deb -f "$package" X-Infiltrator-Source-Revision)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/payload"
          dpkg-deb -x "$package" "$RUNNER_TEMP/payload"
          test "$(find "$RUNNER_TEMP/payload" -type f | wc -l)" -eq 2
          test -s "$RUNNER_TEMP/payload/System/Filesystems/SFS2.so"
          test -s "$RUNNER_TEMP/payload/System/Resources/Documentation/Filesystem-SFS2.pdf"
          test "$(head -c 5 "$RUNNER_TEMP/payload/System/Resources/Documentation/Filesystem-SFS2.pdf")" = '%PDF-'
          nm -D "$RUNNER_TEMP/payload/System/Filesystems/SFS2.so" | grep -F infiltrator_filesystem_sfs2_v1
      - uses: actions/upload-artifact@v4
        with:
          name: sfs2-installers
          path: dist/*
          if-no-files-found: error
  kernel:
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sfs2-installers
          path: dist
      - name: Prepare the pinned Linux build
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential binutils cmake git pkg-config libssl-dev libsqlite3-dev dpkg-dev bc bison flex libelf-dev kmod
          curl --fail --location --retry 5 https://codeload.github.com/gregkh/linux/tar.gz/f717995cb7dcd8998ab15516b8006aea09cfde0d -o "$RUNNER_TEMP/linux.tar.gz"
          mkdir -p "$RUNNER_TEMP/linux"
          tar -xzf "$RUNNER_TEMP/linux.tar.gz" -C "$RUNNER_TEMP/linux" --strip-components=1
          kernel="$RUNNER_TEMP/linux"
          make -C "$kernel" defconfig
          "$kernel/scripts/config" --file "$kernel/.config" --enable MODULES --disable WERROR --disable DEBUG_INFO
          make -C "$kernel" olddefconfig
          make -C "$kernel" -j2 bzImage modules
          test -s "$kernel/Module.symvers"
          test "$(make -s -C "$kernel" kernelrelease)" = 6.12.107
      - name: Compile all three files through the manual RUN
        shell: bash
        run: |
          set -euo pipefail
          bash dist/*.run --profile portable --kernel-build "$RUNNER_TEMP/linux" --build-only --output "$RUNNER_TEMP/manual"
          python3 standalone/check-package.py "$RUNNER_TEMP"/manual/*.deb --profile portable --kernel-release 6.12.107
          dpkg-deb -x "$RUNNER_TEMP"/manual/*.deb "$RUNNER_TEMP/manual-root"
          dpkg-deb -x dist/*.deb "$RUNNER_TEMP/portable-root"
          repository=$(python3 -c 'import sys; sys.path.insert(0,"standalone"); import build; print(build.REPO)')
          identifier=$(printf '%s' "$repository" | sed 's/^Filesystem-//' | tr '[:upper:]' '[:lower:]')
          manual=$(python3 -c 'import sys; sys.path.insert(0,"standalone"); import build; print(build.PDF.name)')
          cmp "$RUNNER_TEMP/manual-root/System/Resources/Documentation/$repository.pdf" "$RUNNER_TEMP/portable-root/System/Resources/Documentation/$repository.pdf"
          mkdir -p build/qualified
          install -m 0644 "$RUNNER_TEMP/manual-root/System/Kernel/Filesystems/$identifier.ko" "build/qualified/$identifier-linux-6.12.107.ko"
          package=$(find dist -maxdepth 1 -name '*.deb' -print -quit)
          python3 standalone/release.py bundle-kernel "$package" "build/qualified/$identifier-linux-6.12.107.ko" "build/qualified/$(basename "$package")"
          python3 standalone/check-package.py build/qualified/*.deb --profile portable --kernel-release 6.12.107
      - uses: actions/upload-artifact@v4
        with:
          name: qualified-kernel-package
          path: build/qualified/*
          if-no-files-found: error
  publish:
    needs: [qualify, kernel]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sfs2-installers
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: qualified-kernel-package
          path: kernel-qualified
      - name: Include the qualified kernel module
        run: |
          set -euo pipefail
          install -m 0644 kernel-qualified/*.deb dist/
          install -m 0644 kernel-qualified/*.ko dist/
          python3 standalone/check-package.py dist/*.deb --profile portable --kernel-release 6.12.107
      - name: Publish immutable qualified source installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 3
          version="$(tr -d '\r\n' < VERSION)"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Existing immutable release $tag retained"
            exit 0
          fi
          gh release create "$tag" dist/*.deb dist/*.run dist/*.ko --target "$GITHUB_SHA" \
            --title "SFS2 read-only module $version" \
            --notes "SFS2 identity/geometry-only implementation, independent of SFS0. Portable DEB and source-embedded native RUN contain SFS2.so, its generated manual and the qualified Linux adapter. Defrag, formatting, mutation, recovery and full independent-media support are NOT qualified."
