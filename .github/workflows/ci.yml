name: SFS2 independent shared-library qualification
on:
  push:
    branches: [main]
    paths: ['CMakeLists.txt','module/**','include/**','native/**','tests/**','.github/workflows/ci.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile canonical SFS2.so with strict warnings
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build --parallel 2
          test -f build/SFS2.so
          nm -D build/SFS2.so | grep -Fq infiltrator_filesystem_api_v2
          readelf -p .ifsmeta build/SFS2.so | grep -Fq 'IFS-MODULE:sfs2:common2'
          if nm -D build/SFS2.so | grep -Eq 'infiltrator_filesystem_.*_v1|infiltrator_filesystem_api_v1'; then
            echo "Retired filesystem export found" >&2
            exit 1
          fi
      - name: Qualify geometry and reject SFS0 and corrupt roots
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

      - name: Verify exactly one PDF per runtime SO
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          DESTDIR="$stage" cmake --install build
          test "$(find "$stage" -type f | wc -l)" -eq 2
          test -f "$stage/System/Filesystems/SFS2.so"
          test -f "$stage/System/Resources/Documentation/Filesystem-SFS2.pdf"
          test "$(head -c 5 "$stage/System/Resources/Documentation/Filesystem-SFS2.pdf")" = '%PDF-'
